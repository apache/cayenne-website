site:
  title: Apache Cayenne
  url: https://m-dzianishchyts.github.io/cayenne-website/docs
  start_page: cayenne:getting-started:index.adoc
antora:
  extensions:
    - '@antora/collector-extension'
    - '@antora/lunr-extension'
asciidoc:
  attributes:
    ehcache-version: '3.8.1'
content:
  sources:
    - url: c:/Users/mdzianishchyts/IdeaProjects/cayenne
      branches:
        - ALPHA-5.0-antora
        - STABLE-4.2-antora
        - STABLE-4.1-antora
        - STABLE-4.0-antora
      start_paths: docs/*
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/0e38223adfd81eb74d4b1779e158f8ad05ff8923/raw/build/ui-bundle.zip?job=bundle-stable
  supplemental_files: ./supplemental-ui
  output_dir: ui
output:
  dir: ./../target/site/docs
