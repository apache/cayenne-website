        </button>

        <div class="collapse navbar-collapse" id="mainMenu">
          <ul class="navbar-nav  mt-3 mt-lg-0 ms-auto">

            <li class="nav-item">
              <a class="nav-link" href="{{ .URL | relURL }}">{{ upper .Name }}</a>
            </li>
            {{ end }}
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="apacheDropdown" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <img class="mw-15px mr-1" src="{{ "img/oakleaf.svg" | relURL }}" alt="" />APACHE
              </a>
              <div class="dropdown-menu rounded-0" aria-labelledby="apacheDropdown">
